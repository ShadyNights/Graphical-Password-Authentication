apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: gpa-prod
spec:
  serviceName: "postgres"
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_DB
          value: gpa_auth
        - name: POSTGRES_USER
          valueFrom:
             secretKeyRef:
               name: gpa-secrets
               key: db-user
        - name: POSTGRES_PASSWORD
          valueFrom:
             secretKeyRef:
               name: gpa-secrets
               key: db-password
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: postgres-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: gpa-prod
spec:
  ports:
  - port: 5432
  selector:
    app: postgres
