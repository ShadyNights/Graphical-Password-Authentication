apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpa-auth
  namespace: gpa-prod
  labels:
    app: gpa-auth
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gpa-auth
  template:
    metadata:
      labels:
        app: gpa-auth
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
      containers:
      - name: gpa-auth
        image: gpa-auth:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: gpa-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: gpa-secrets
              key: redis-url
        - name: HSM_ENDPOINT
          value: "hsm-service.security.svc.cluster.local"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
